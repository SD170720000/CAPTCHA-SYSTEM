{% extends "index.html" %}
{% block title %}Human Verification{% endblock %}

{% block body %}
<div class="card" id="main-card">

    <h1 id="main-title">Human Verification</h1>
    <p id="main-desc">Click start button to begin the verification</p>

    <button id="start-btn" class="start-btn">▶︎&nbsp;&nbsp; Start Captcha</button>

    <!-- Captcha Section -->
    <div id="captcha-section" style="display:none;">
        
        <h3 id="step-label"></h3>

        <div id="captcha-container"></div>

        <button id="final-verify-btn" class="final-btn" disabled>Verify</button>
    </div>
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
{% endblock %}
